<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rueda Nocturna | Prototipo</title>
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans">
    <main class="max-w-4xl mx-auto px-4 py-16">
        <section class="space-y-6">
            <span class="inline-block bg-amber-500 text-slate-950 text-xs font-bold uppercase tracking-wider px-3 py-1 rounded-full">
                Nuevo · Jueves a sábado
            </span>

            <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight text-white leading-tight">
                Rueda Nocturna
            </h1>

            <p class="text-lg sm:text-xl text-slate-300 max-w-2xl font-normal leading-relaxed">
                Descubre Medellín en bici cuando se encienden las luces.
            </p>

            <div class="flex flex-wrap gap-6 pt-2 pb-4 text-slate-200">
                <div class="bg-slate-900 border border-slate-800 px-5 py-3 rounded-xl shadow-md">
                    <span class="block text-2xl font-bold text-amber-400">3 rutas</span>
                    <span class="text-xs uppercase tracking-wider text-slate-400">Disponibles</span>
                </div>
                <div class="bg-slate-900 border border-slate-800 px-5 py-3 rounded-xl shadow-md">
                    <span class="block text-2xl font-bold text-amber-400">Desde $55.000</span>
                    <span class="text-xs uppercase tracking-wider text-slate-400">Tarifa base</span>
                </div>
            </div>

            <div class="pt-2">
                <a href="#" 
                    class="inline-block bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-base px-6 py-3 rounded-xl shadow-lg transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:ring-offset-2 focus:ring-offset-slate-950">
                    Inscríbete
                </a>
            </div>
        </section>
    </main>
</body>
</html>
